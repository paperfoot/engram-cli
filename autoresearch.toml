# engram — autoresearch loop config
#
# Goal: maximise hallucination-resistance on science (see program.md). The
# scored axes (LitQA2 precision-with-abstention, BEIR-sci nDCG@10, ALCE/BioGen
# citation P/R, repaired RAGAS faithfulness) require paid answerer/judge calls
# (anthropic/claude-opus-4.8 + google/gemini-3.1-pro-preview) and are run
# manually — see README.md → Benchmarks for the exact commands.
#
# The loop's automated eval_command is the OFFLINE, CI-stable `engram
# bench mini` smoke: deterministic, no API keys, no network. It emits a JSON
# envelope; we extract data.recall_at_5 as a bare float. It is a stability
# guard (catches regressions / keeps the loop green), not a quality signal —
# it saturates near 1.0, so do not optimise it. Every experiment still flips
# ONE knob at a time in scripts/experiment.vars (the target file).

target_file     = "scripts/experiment.vars"
eval_command    = "engram --json bench mini | jq -r '.data.recall_at_5'"
metric_name     = "bench_mini_recall_at_5"
metric_direction = "maximize"
time_budget_seconds = 300   # 5 min ceiling; the offline smoke runs in <1s
branch          = "feat/mlx-reranker"

[bounds]
implausible_above = 1.001
implausible_below = 0.0
